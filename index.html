// ============================================
// シフト種別の動的判定
// ============================================
function getShiftInfo(shift, dayOfWeek, isHoliday) {
  // 空欄の扱い：土日・祝日はお休み、平日は日勤定時（8:30-17:30）
  if (!shift) {
    if (isHoliday) return { type: "holiday", bg: "#f5dfe7", fg: "#8a4a63", label: "祝日", time: "—" };
    if (dayOfWeek === 0 || dayOfWeek === 6) return { type: "off", bg: "#eceae4", fg: "#8a847a", label: "お休み", time: "—" };
    if (dayOfWeek !== undefined) return { type: "default_day", bg: "#ffffff", fg: "#3a3530", label: "日勤", time: "8:30 – 17:30" };
    return { type: "off", bg: "#eceae4", fg: "#8a847a", label: "お休み", time: "—" };
  }
  if (shift === "確定休") return { type: "fixed_off", bg: "#f8d7d4", fg: "#a8352c", label: "休み", time: "—" };
  if (shift === "祝") return { type: "holiday", bg: "#f5dfe7", fg: "#8a4a63", label: "祝日", time: "—" };
  if (shift === "休") return { type: "off", bg: "#eceae4", fg: "#8a847a", label: "お休み", time: "—" };
  if (shift === "研") return { type: "training", bg: "#ece4f0", fg: "#6a4a8a", label: "研修", time: "終日研修" };

  if (shift.includes("PM研修")) {
    const base = shift.replace("PM研修", "");
    if (base.includes("早")) return { type: "early", bg: "#fff4d6", fg: "#8a6318", label: "早番・午後研修", time: "7:00 – 16:00" };
    return { type: "day", bg: "#ffffff", fg: "#3a3530", label: "日勤・午後研修", time: "8:30 – 17:30" };
  }
  if (shift.includes("PM休")) {
    let time = "午後休み";
    if (shift === "早PM休") time = "7:00 – 11:00";
    else if (shift.includes(" ")) {
      // "7.5 PM休" などの数字スタート
      const num = parseFloat(shift.split(" ")[0]);
      if (!isNaN(num)) {
        const startH = Math.floor(num);
        const startM = num % 1 === 0.5 ? "30" : "00";
        const endH = startH + 4;
        time = `${startH}:${startM} – ${endH}:${startM}`;
      }
    }
    return { type: "am_work", bg: "#fbe4d4", fg: "#a8541e", label: "午前出勤", time };
  }
  if (shift.includes("AM研")) return { type: "am_train", bg: "#e6def0", fg: "#6a4a8a", label: "午前研修", time: "午前研修" };
  if (shift.includes("AM休")) return { type: "pm_work", bg: "#d8e0eb", fg: "#2f5a8a", label: "午後出勤", time: "午前休み" };

  if (shift.includes("早")) return { type: "early", bg: "#fff4d6", fg: "#8a6318", label: "早番", time: shift.includes("/") ? shift.replace("/", " – ") : "7:00 – 16:00" };
  if (shift.includes("遅")) return { type: "late", bg: "#e3ecf7", fg: "#2f5a8a", label: "遅番", time: shift.includes("/") ? shift.replace("/", " – ") : "10:00 – 19:00" };

  if (shift.includes("/")) {
    const [start, end] = shift.split("/");
    return { type: "day_range", bg: "#ffffff", fg: "#3a3530", label: "日勤", time: `${start}:00 – ${end}:00` };
  }

  return { type: "day", bg: "#ffffff", fg: "#3a3530", label: "日勤", time: `${shift}:00 頃〜` };
}

// ============================================
// セル内容表示（複合値は2段）
// ============================================
function renderCellContent(shift) {
  if (!shift) return null;
  if (shift === "確定休") return <span className="text-[11px] font-medium">休</span>;
  if (shift === "休") return <span className="text-[10px]">休</span>;
  if (shift === "祝") return <span className="text-[10px]">祝</span>;
  if (shift === "研") return <span className="text-[11px] font-medium">研</span>;

  if (shift.includes("AM研")) {
    const after = shift.replace("AM研", "");
    return (
      <div className="flex flex-col items-center leading-none">
        <span className="text-[7px] opacity-70">AM研</span>
        <span className="text-[10px] font-medium">{after || "遅"}</span>
      </div>
    );
  }
  if (shift.includes("AM休")) {
    const after = shift.replace("AM休", "");
    return (
      <div className="flex flex-col items-center leading-none">
        <span className="text-[7px] opacity-70">AM休</span>
        <span className="text-[10px] font-medium">{after || "遅"}</span>
      </div>
    );
  }
  if (shift.includes("PM研修")) {
    const base = shift.replace("PM研修", "");
    return (
      <div className="flex flex-col items-center leading-none">
        <span className="text-[10px] font-medium">{base}</span>
        <span className="text-[7px] opacity-70">PM研修</span>
      </div>
    );
  }
  if (shift.includes("PM休")) {
    const base = shift.replace("PM休", "");
    return (
      <div className="flex flex-col items-center leading-none">
        <span className="text-[10px] font-medium">{base}</span>
        <span className="text-[7px] opacity-70">PM休</span>
      </div>
    );
  }

  if (shift.includes("/")) {
    const [top, bottom] = shift.split("/");
    return (
      <div className="flex flex-col items-center leading-none gap-0.5">
        <span className="text-[10px] font-medium">{top}</span>
        <span className="text-[8px] opacity-80">{bottom}</span>
      </div>
    );
  }

  return <span className="text-[11px] font-medium">{shift}</span>;
}

// ============================================
// MONTH画面
// ============================================
function MonthScreen({ theme, config, userShift }) {
  const { year, month, days, today } = config;
  const firstDayOfWeek = new Date(year, month - 1, 1).getDay();
  const cells = [];
  for (let i = 0; i < firstDayOfWeek; i++) cells.push(null);
  for (let d = 1; d <= days; d++) cells.push(d);

  return (
    <div className="px-5 pt-4 pb-24">
      <div className="mb-5 px-1">
        <p className="text-xs uppercase tracking-widest" style={{ color: theme.muted, letterSpacing: "0.15em" }}>
          Reiwa 8 · {config.monthEn}
        </p>
        <h1 className="text-3xl font-serif" style={{ color: theme.ink }}>{config.monthLabel}</h1>
      </div>

      <div className="grid grid-cols-7 gap-1 mb-2">
        {["日","月","火","水","木","金","土"].map((w, i) => (
          <div key={w} className="text-center text-[10px] font-medium py-1" style={{ color: i === 0 ? "#c4628a" : i === 6 ? "#5a8ac4" : theme.muted }}>
            {w}
          </div>
        ))}
      </div>

      <div className="grid grid-cols-7 gap-1">
        {cells.map((d, idx) => {
          if (!d) return <div key={idx} />;
          const shift = userShift.d[d];
          const dayOfWeek = new Date(year, month - 1, d).getDay();
          const isHoliday = config.holidays[d];
          const info = getShiftInfo(shift, dayOfWeek, isHoliday);
          const hasEvent = config.events[d];
          const isToday = d === today;

          let bg = info.bg;
          let fg = info.fg;
          if (isHoliday && !shift) { bg = "#f5dfe7"; fg = "#8a4a63"; }

          return (
            <div
              key={idx}
              className="aspect-[3/4] rounded-xl p-1.5 flex flex-col justify-between"
              style={{
                background: bg,
                border: isToday ? `2.5px solid ${theme.accent}` : bg === "#ffffff" ? "1px solid rgba(0,0,0,0.08)" : "1px solid rgba(0,0,0,0.03)",
                boxShadow: isToday ? `0 4px 14px ${theme.accent}30` : "none",
              }}
            >
              <div className="flex items-start justify-between">
                <span
                  className="text-[11px] font-serif tabular-nums"
                  style={{
                    color: isToday ? theme.accent : isHoliday ? "#c4628a" : fg,
                    fontWeight: isToday ? 700 : 400,
                  }}
                >{d}</span>
                {hasEvent && <div className="w-1 h-1 rounded-full mt-1 mr-0.5" style={{ background: theme.accent }} />}
              </div>
              <div className="text-[9px] font-medium text-center leading-tight" style={{ color: fg }}>
                {shift === "確定休" ? "休" : (shift ? (shift.includes("/") ? shift.split("/")[0] : shift) : (isHoliday ? "祝" : ""))}
              </div>
            </div>
          );
        })}
      </div>

      <div className="mt-6">
        <h2 className="text-xs uppercase tracking-widest mb-3 px-1" style={{ color: theme.muted, letterSpacing: "0.15em" }}>今月の行事</h2>
        <div className="space-y-1.5">
          {Object.entries(config.events).map(([d, name]) => (
            <div key={d} className="flex items-center gap-3 p-3 rounded-2xl" style={{ background: "#ffffff", border: "1px solid rgba(0,0,0,0.04)" }}>
              <div className="w-9 h-9 rounded-xl flex items-center justify-center font-serif text-sm" style={{ background: `${theme.accent}15`, color: theme.accent }}>
                {d}
              </div>
              <div className="flex-1">
                <div className="text-sm font-medium" style={{ color: theme.ink }}>{name}</div>
                <div className="text-[11px]" style={{ color: theme.muted }}>
                  {config.monthLabel}{d}日 ({["日","月","火","水","木","金","土"][new Date(year, month-1, parseInt(d)).getDay()]})
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ALL STAFF画面（二列・フルネーム・セル小さく7日表示）
// ============================================
function AllStaffScreen({ theme, config, staffList, stickyTop }) {
  const days = Array.from({ length: config.days }, (_, i) => i + 1);
  const headerScrollRef = useRef(null);
  const bodyScrollRef = useRef(null);
  const syncingRef = useRef(false);

  useEffect(() => {
    if (bodyScrollRef.current) {
      const cellWidth = bodyScrollRef.current.scrollWidth / config.days;
      const targetLeft = config.today ? Math.max(0, (config.today - 2) * cellWidth) : 0;
      bodyScrollRef.current.scrollLeft = targetLeft;
      if (headerScrollRef.current) headerScrollRef.current.scrollLeft = targetLeft;
    }
  }, [config.days, config.today, staffList]);

  // 横スクロールをヘッダー⇄本体で同期
  const handleScroll = (source, target) => {
    if (syncingRef.current) return;
    if (source.current && target.current && source.current.scrollLeft !== target.current.scrollLeft) {
      syncingRef.current = true;
      target.current.scrollLeft = source.current.scrollLeft;
      requestAnimationFrame(() => { syncingRef.current = false; });
    }
  };

  const NAME_COL_WIDTH = 84;
  const ROW_HEIGHT = 44;
  const HEADER_HEIGHT = 44;
  const VISIBLE_DAYS = 7;

  return (
    <div className="pt-4 pb-24">
      <div className="px-5 mb-4">
        <p className="text-xs uppercase tracking-widest" style={{ color: theme.muted, letterSpacing: "0.15em" }}>
          All Staff · {config.monthEn}
        </p>
        <h1 className="text-3xl font-serif" style={{ color: theme.ink }}>全員のシフト</h1>
        <p className="text-[11px] mt-1" style={{ color: theme.muted }}>
          {config.label} · {staffList.length}名 · ← 横にスワイプ
        </p>
      </div>

      <style>{`
        .matrix-cell {
          flex-shrink: 0;
          width: calc((100vw - ${NAME_COL_WIDTH}px) / ${VISIBLE_DAYS});
          min-width: 38px;
          scroll-snap-align: start;
        }
        @media (min-width: 640px) {
          .matrix-cell {
            width: calc((370px - ${NAME_COL_WIDTH}px) / ${VISIBLE_DAYS});
            min-width: 0;
          }
        }
      `}</style>

      {/* ━━━ スティッキー日付ヘッダー（縦スクロール時も見える） ━━━ */}
      <div
        className="sticky z-30 flex"
        style={{
          top: stickyTop || 58,
          background: theme.bg,
          boxShadow: "0 2px 6px rgba(0,0,0,0.05)",
        }}
      >
        <div
          className="flex-shrink-0"
          style={{
            width: NAME_COL_WIDTH,
            height: HEADER_HEIGHT,
            background: theme.bg,
            borderRight: "1px solid rgba(0,0,0,0.08)",
            borderBottom: "1px solid rgba(0,0,0,0.05)",
          }}
        />
        <div
          ref={headerScrollRef}
          onScroll={() => handleScroll(headerScrollRef, bodyScrollRef)}
          className="flex-1 overflow-x-auto overflow-y-hidden"
          style={{ scrollbarWidth: "none" }}
        >
          <div className="flex border-b" style={{ height: HEADER_HEIGHT, borderColor: "rgba(0,0,0,0.05)" }}>
            {days.map(d => {
              const dayOfWeek = new Date(config.year, config.month - 1, d).getDay();
              const isHoliday = config.holidays[d];
              const isToday = d === config.today;
              const dayColor = isHoliday || dayOfWeek === 0 ? "#c4628a" : dayOfWeek === 6 ? "#5a8ac4" : theme.ink;
              return (
                <div
                  key={d}
                  className="matrix-cell flex flex-col items-center justify-center relative"
                  style={{
                    background: isToday ? `${theme.accent}18` : "transparent",
                    borderLeft: isToday ? `2px solid ${theme.accent}` : "none",
                    borderRight: isToday ? `2px solid ${theme.accent}` : "none",
                  }}
                >
                  <span className="text-[8px]" style={{ color: dayColor, opacity: 0.7 }}>
                    {["日","月","火","水","木","金","土"][dayOfWeek]}
                  </span>
                  <span
                    className="text-sm font-serif tabular-nums leading-tight"
                    style={{ color: isToday ? theme.accent : dayColor, fontWeight: isToday ? 700 : 400 }}
                  >
                    {d}
                  </span>
                  {isToday && (
                    <div className="absolute bottom-0 left-1 right-1 h-[2px] rounded-full" style={{ background: theme.accent }} />
                  )}
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* ━━━ 本体（名前列＋シフト行） ━━━ */}
      <div className="flex">
        {/* 左：名前列 */}
        <div
          className="flex-shrink-0 z-10"
          style={{
            width: NAME_COL_WIDTH,
            background: theme.bg,
            borderRight: "1px solid rgba(0,0,0,0.08)",
            boxShadow: "3px 0 8px rgba(0,0,0,0.04)",
          }}
        >
          {staffList.map((staff, i) => (
            <div
              key={i}
              className="flex items-center px-2 border-b"
              style={{
                height: ROW_HEIGHT,
                borderColor: "rgba(0,0,0,0.04)",
                background: staff.partTime ? `${theme.accent}08` : "transparent",
              }}
            >
              {staff.partTime ? (
                <div className="text-[8.5px] leading-tight font-medium" style={{ color: theme.accent }}>
                  {staff.name}
                </div>
              ) : (
                <>
                  <div
                    className="w-5 h-5 rounded-full flex items-center justify-center text-[9px] font-medium mr-1.5 flex-shrink-0"
                    style={{ background: `${theme.accent}15`, color: theme.accent }}
                  >
                    {staff.name.charAt(0)}
                  </div>
                  <div className="text-[9px] leading-tight" style={{ color: theme.ink }}>
                    {staff.name}
                  </div>
                </>
              )}
            </div>
          ))}
        </div>

        {/* 右：シフトマトリクス（横スクロール） */}
        <div
          ref={bodyScrollRef}
          onScroll={() => handleScroll(bodyScrollRef, headerScrollRef)}
          className="flex-1 overflow-x-auto overflow-y-hidden"
          style={{ scrollbarWidth: "none", scrollSnapType: "x mandatory" }}
        >
          {staffList.map((staff, i) => (
            <div
              key={i}
              className="flex border-b"
              style={{
                height: ROW_HEIGHT,
                borderColor: "rgba(0,0,0,0.04)",
                background: staff.partTime ? `${theme.accent}05` : "transparent",
              }}
            >
              {days.map(d => {
                const shift = staff.d[d];
                const dayOfWeek = new Date(config.year, config.month - 1, d).getDay();
                const isHoliday = config.holidays[d];
                const isToday = d === config.today;
                const isSunday = dayOfWeek === 0;
                const isSaturday = dayOfWeek === 6;
                const info = getShiftInfo(shift, dayOfWeek, isHoliday);

                let cellBg = "#ffffff";
                let cellFg = theme.muted;
                let cellContent = null;
                let isFixed = false;

                if (staff.partTime) {
                  if (shift) {
                    cellBg = "#fff4d6";
                    cellFg = "#8a6318";
                    cellContent = <span className="text-[9px] font-medium">{shift}</span>;
                  } else if (isSunday) {
                    cellBg = "#eef2f8";
                  } else {
                    cellBg = "#faf8f3";
                  }
                } else if (shift) {
                  cellBg = info.bg;
                  cellFg = info.fg;
                  cellContent = renderCellContent(shift);
                  isFixed = shift === "確定休";
                } else if (isHoliday) {
                  cellBg = "#f5dfe7";
                  cellFg = "#8a4a63";
                  cellContent = <span className="text-[9px]">祝</span>;
                } else if (isSunday || isSaturday) {
                  cellBg = "#eef2f8";
                  cellContent = <span className="text-[9px] opacity-60" style={{ color: "#5a8ac4" }}>休</span>;
                } else {
                  // 平日空欄 = 日勤定時（8:30-17:30）
                  cellBg = "#ffffff";
                  cellFg = "#3a3530";
                  cellContent = <span className="text-[9px] opacity-60">定</span>;
                }

                return (
                  <div
                    key={d}
                    className="matrix-cell flex items-center justify-center p-0.5"
                    style={{
                      background: isToday ? `${theme.accent}10` : "transparent",
                      borderLeft: isToday ? `2px solid ${theme.accent}` : "none",
                      borderRight: isToday ? `2px solid ${theme.accent}` : "none",
                    }}
                  >
                    <div
                      className="w-full h-full rounded-md flex items-center justify-center"
                      style={{
                        background: cellBg,
                        color: cellFg,
                        border: isFixed ? "1.5px solid #d65044" : cellBg === "#ffffff" ? "1px solid rgba(0,0,0,0.12)" : "1px solid rgba(0,0,0,0.03)",
                        boxShadow: isToday ? `0 0 0 1.5px ${theme.accent}55` : "none",
                      }}
                    >
                      {cellContent}
                    </div>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      </div>

      <div className="px-5 mt-5">
        <h2 className="text-xs uppercase tracking-widest mb-2.5" style={{ color: theme.muted, letterSpacing: "0.15em" }}>凡例</h2>
        <div className="flex flex-wrap gap-1.5">
          {[
            { label: "早番", bg: "#fff4d6" },
            { label: "遅番", bg: "#e3ecf7" },
            { label: "日勤・時短", bg: "#ffffff", subtleBorder: true },
            { label: "定 = 8:30-17:30", bg: "#ffffff", subtleBorder: true },
            { label: "午前/午後休", bg: "#fbe4d4" },
            { label: "休み", bg: "#f8d7d4", border: "#d65044" },
            { label: "祝日", bg: "#f5dfe7" },
          ].map(item => (
            <div key={item.label} className="flex items-center gap-1.5 px-2.5 py-1 rounded-full" style={{ background: "#ffffff", border: "1px solid rgba(0,0,0,0.05)" }}>
              <div className="w-3.5 h-3.5 rounded" style={{ background: item.bg, border: item.border ? `1.5px solid ${item.border}` : item.subtleBorder ? "1px solid rgba(0,0,0,0.18)" : "1px solid rgba(0,0,0,0.05)" }} />
              <span className="text-[10px]" style={{ color: theme.ink }}>{item.label}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

                  onClick={() => setStep(1)}

                  style={{ background: "transparent", color: "#8a9089" }}
                >
                  ← 園を変える

            )}

        </div>
      </div>
    </>
  );
}

// ============================================
// メインアプリ
// ============================================
function ShiftApp() {
  // プロファイル（localStorage 永続化）
  const [profile, setProfile] = useState(() => {
    try {
      const saved = localStorage.getItem("shiftapp_profile_v1");
      if (saved) return JSON.parse(saved);
    } catch (e) { /* localStorage が使えない場合はスキップ */ }
    return null;
  });

  // 表示中の園・月・タブ（Hooksは早期return前に必ず呼ぶ）
  const [garden, setGarden] = useState(profile ? profile.garden : "hinoki");
  // 初期表示：当月が10月なら10月、それ以外は9月
  const DEFAULT_MONTH = (new Date().getMonth() + 1) === 10 ? 10 : 9;
  const [hinokiMonth, setHinokiMonth] = useState(DEFAULT_MONTH);
  const [sakuraMonth, setSakuraMonth] = useState(DEFAULT_MONTH);
  const [tab, setTab] = useState("all"); // ★デフォルトは全員シフト

  // プロファイルの所属園が変わったら表示中の園もそれに追従
  useEffect(() => {
    if (profile) setGarden(profile.garden);
  }, [profile && profile.garden]);

  // 個人月間タブで他園に切り替えたときは全員タブへ自動遷移
  useEffect(() => {
    if (tab === "month" && profile && garden !== profile.garden) {
      setTab("all");
    }
  }, [garden, tab, profile && profile.garden]);

  const saveProfile = (p) => {
    setProfile(p);
    try { localStorage.setItem("shiftapp_profile_v1", JSON.stringify(p)); } catch (e) {}
  };

  const resetProfile = () => {
    setProfile(null);
    try { localStorage.removeItem("shiftapp_profile_v1"); } catch (e) {}
  };

  // 初回起動 → Onboarding（Hooksの後に判定）
  if (!profile) {
    return <OnboardingScreen onComplete={saveProfile} />;
  }

  // configキー：園 × 月
  const configKey = garden === "hinoki" ? `hinoki-${hinokiMonth}` : `sakura-${sakuraMonth}`;
  const baseConfig = MONTH_CONFIG[configKey];

  // 今日の日付を実時間から動的計算（表示中の年月と一致する場合のみ）
  const realNow = new Date();
  const isCurrentMonth =
    baseConfig.year === realNow.getFullYear() &&
    baseConfig.month === realNow.getMonth() + 1;
  const config = {
    ...baseConfig,
    today: isCurrentMonth ? realNow.getDate() : null,
  };

  // スタッフリスト
  let staffList;
  if (garden === "hinoki") {
    staffList = hinokiMonth === 9 ? STAFF_HINOKI_SEP : STAFF_HINOKI_OCT;
  } else {
    staffList = sakuraMonth === 9 ? STAFF_SAKURA_SEP : STAFF_SAKURA_OCT;
  }

  // 個人月間で参照する「自分のシフト」
  const userShift = (garden === profile.garden)
    ? (staffList.find(s => s.name === profile.name) || staffList[0])
    : staffList[0];

  const theme = garden === "hinoki"
    ? { accent: "#2d5f3f", ink: "#1f2a24", muted: "#8a9089", bg: "#f7f5f0" }
    : { accent: "#c4628a", ink: "#2a1f25", muted: "#a8969e", bg: "#faf5f3" };

  const isViewingOwnGarden = garden === profile.garden;

  return (
    <>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        * { font-family: 'Noto Sans JP', sans-serif; -webkit-font-smoothing: antialiased; }
        .font-serif { font-family: 'Noto Serif JP', serif; }
        ::-webkit-scrollbar { display: none; }
      `}</style>

      <div className="min-h-screen flex items-center justify-center p-0 sm:p-8" style={{ background: "#e8e4dc" }}>
        <div
          className="relative w-full sm:w-[390px] sm:h-[844px] sm:rounded-[54px] sm:border-[10px] sm:border-black overflow-hidden"
          style={{ background: theme.bg, boxShadow: "0 40px 80px rgba(0,0,0,0.15)" }}
        >
          <div className="hidden sm:flex absolute top-0 left-0 right-0 h-11 items-center justify-between px-8 z-50 text-xs font-semibold" style={{ color: theme.ink }}>
            <span>9:41</span>
            <div className="absolute left-1/2 top-2 -translate-x-1/2 w-28 h-7 bg-black rounded-full" />
            <span>•••</span>
          </div>

          <div className="h-screen sm:h-full overflow-y-auto sm:pt-11" style={{ height: "100dvh" }}>
            <div className="sticky top-0 z-40 px-5 pt-4 pb-3" style={{ background: `${theme.bg}f0`, backdropFilter: "blur(12px)" }}>
              <div className="flex rounded-2xl p-1 gap-0.5 overflow-x-auto" style={{ background: "#00000008", scrollbarWidth: "none" }}>
                <button
                  onClick={() => { setGarden("hinoki"); setHinokiMonth(9); }}
                  className="flex-1 min-w-[84px] whitespace-nowrap py-2 rounded-xl text-[11px] font-medium transition-all"
                  style={{
                    background: garden === "hinoki" && hinokiMonth === 9 ? "#ffffff" : "transparent",
                    color: garden === "hinoki" && hinokiMonth === 9 ? "#2d5f3f" : "#8a9089",
                    boxShadow: garden === "hinoki" && hinokiMonth === 9 ? "0 2px 6px rgba(0,0,0,0.06)" : "none",
                  }}
                >
                  <span className="inline-block w-1.5 h-1.5 rounded-full mr-1 align-middle" style={{ background: "#2d5f3f" }} />
                  アンファン9月
                </button>
                <button
                  onClick={() => { setGarden("hinoki"); setHinokiMonth(10); }}
                  className="flex-1 min-w-[84px] whitespace-nowrap py-2 rounded-xl text-[11px] font-medium transition-all"
                  style={{
                    background: garden === "hinoki" && hinokiMonth === 10 ? "#ffffff" : "transparent",
                    color: garden === "hinoki" && hinokiMonth === 10 ? "#2d5f3f" : "#8a9089",
                    boxShadow: garden === "hinoki" && hinokiMonth === 10 ? "0 2px 6px rgba(0,0,0,0.06)" : "none",
                  }}
                >
                  <span className="inline-block w-1.5 h-1.5 rounded-full mr-1 align-middle" style={{ background: "#2d5f3f" }} />
                  アンファン10月
                </button>
                <button
                  onClick={() => { setGarden("sakura"); setSakuraMonth(9); }}
                  className="flex-1 min-w-[84px] whitespace-nowrap py-2 rounded-xl text-[11px] font-medium transition-all"
                  style={{
                    background: garden === "sakura" && sakuraMonth === 9 ? "#ffffff" : "transparent",
                    color: garden === "sakura" && sakuraMonth === 9 ? "#c4628a" : "#8a9089",
                    boxShadow: garden === "sakura" && sakuraMonth === 9 ? "0 2px 6px rgba(0,0,0,0.06)" : "none",
                  }}
                >
                  <span className="inline-block w-1.5 h-1.5 rounded-full mr-1 align-middle" style={{ background: "#c4628a" }} />
                  陽の木9月
                </button>
                <button
                  onClick={() => { setGarden("sakura"); setSakuraMonth(10); }}
                  className="flex-1 min-w-[84px] whitespace-nowrap py-2 rounded-xl text-[11px] font-medium transition-all"
                  style={{
                    background: garden === "sakura" && sakuraMonth === 10 ? "#ffffff" : "transparent",
                    color: garden === "sakura" && sakuraMonth === 10 ? "#c4628a" : "#8a9089",
                    boxShadow: garden === "sakura" && sakuraMonth === 10 ? "0 2px 6px rgba(0,0,0,0.06)" : "none",
                  }}
                >
                  <span className="inline-block w-1.5 h-1.5 rounded-full mr-1 align-middle" style={{ background: "#c4628a" }} />
                  陽の木10月
                </button>
              </div>
            </div>

            {tab === "month" && isViewingOwnGarden && (
              <MonthScreen theme={theme} config={config} userShift={userShift} />
            )}
            {tab === "all" && <AllStaffScreen theme={theme} config={config} staffList={staffList} stickyTop={58} />}
            {tab === "settings" && <SettingsScreen theme={theme} profile={profile} onChangeProfile={saveProfile} onResetProfile={resetProfile} />}
          </div>

          <div
            className="absolute bottom-0 left-0 right-0 z-50 px-4 pt-2 pb-6"
            style={{ background: `${theme.bg}f0`, backdropFilter: "blur(12px)", borderTop: "1px solid rgba(0,0,0,0.05)", paddingBottom: "max(env(safe-area-inset-bottom), 1.5rem)" }}
          >
            <div className="flex items-center justify-around">
              {[
                { id: "all", icon: Users, label: "全員" },
                ...(isViewingOwnGarden ? [{ id: "month", icon: Calendar, label: "個人月間" }] : []),
                { id: "settings", icon: Settings, label: "設定" },
              ].map(item => {
                const Icon = item.icon;
                const active = tab === item.id;
                return (
                  <button key={item.id} onClick={() => setTab(item.id)} className="flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl">
                    <Icon size={20} style={{ color: active ? theme.accent : theme.muted }} strokeWidth={active ? 2.2 : 1.8} />
                    <span className="text-[10px] font-medium" style={{ color: active ? theme.accent : theme.muted }}>{item.label}</span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

// マウント
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ShiftApp />);

  </script>
</body>
</html>
