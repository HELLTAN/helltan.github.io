<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>HËLL単 — 80年代メタル英語を会話で覚える</title>
<meta name="description" content="80年代メタルの会話ゲームで英単語を覚えるサバイバル学習アプリ。金色の単語はタップで箔押しピック辞書。全4シナリオ・ROOKIE/DIE-HARDの2難度。">
<meta name="theme-color" content="#100D0C">
<meta property="og:type" content="website">
<meta property="og:url" content="https://helltan.github.io/">
<meta property="og:title" content="HËLL単 — 80年代メタル英語を会話で覚える">
<meta property="og:description" content="フロントマン・文通相手・メン募の電話を相手にメタル英語で返すサバイバル学習ゲーム。完走後はONE MOREの単語をその場で復習。">
<meta property="og:image" content="https://helltan.github.io/helltan-logo.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://helltan.github.io/helltan-logo.png">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340"><path d="M92 18 C110 13 190 13 208 18 C252 28 286 62 284 126 C282 198 226 272 163 322 Q150 334 137 322 C74 272 18 198 16 126 C14 62 48 28 92 18 Z" fill="%23C41E2A" stroke="%23F2EDE3" stroke-width="10"/></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&family=Special+Elite&family=Permanent+Marker&family=Yomogi&display=swap" rel="stylesheet">
<style>
:root{
  --obi-red:#C41E2A; --ink:#100D0C; --steel:#C8C8CE; --paper:#F2EDE3;
  --gold:#C9A227; --dim:#7A736D; --bubble:#241F1C; --me:#3A2A20;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ink); color:var(--steel);
  font-family:'Zen Kaku Gothic New',sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  background-image:radial-gradient(ellipse at 50% -10%, #241f1c 0%, var(--ink) 60%);
}
/* ========== タイトル画面 ========== */
.title-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:18px;overflow-y:auto}
.ts-logo{font-family:'Archivo Black','Zen Kaku Gothic New',sans-serif;font-size:clamp(44px,14vw,64px);color:var(--paper);text-align:center;line-height:1.05;letter-spacing:.02em;margin-top:auto}
/* 先頭margin-top:auto+末尾margin-bottom:autoの安全センタリング:
   収まる時は中央、あふれる時は上詰めでスクロール可能(centerクリップバグ回避) */
.ts-logo .red{color:var(--obi-red);font-weight:900}
img.ts-logo{width:min(420px,90vw);height:auto;display:block;mix-blend-mode:screen;margin-top:auto}
.ts-pos{font-weight:900;font-size:clamp(17px,5.4vw,23px);color:var(--paper);letter-spacing:.42em;text-indent:.42em;text-align:center;margin-top:2px}
.ts-en{font-family:'Archivo Black',sans-serif;font-size:clamp(13px,4.4vw,18px);color:var(--gold);letter-spacing:.16em;text-align:center;margin-top:8px;padding:7px 14px;border-top:1px solid #4a4238;border-bottom:1px solid #4a4238}
.ts-sub{font-size:12px;color:var(--dim);text-align:center;line-height:1.9;max-width:340px}
.sc-cards{display:flex;flex-direction:column;gap:10px;width:min(360px,92vw)}
.sc-card{
  border:1px solid #3a3532;border-radius:3px;background:#1A1512;padding:13px 15px;
  cursor:pointer;text-align:left;font-family:inherit;color:var(--steel);
}
.sc-card[aria-pressed="true"]{border-color:var(--obi-red);background:#241216}
.sc-en{font-family:'Archivo Black',sans-serif;font-size:13.5px;color:var(--gold);letter-spacing:.12em;margin-bottom:5px}
.sc-en .yr{color:var(--paper);font-size:16px;margin-left:4px;border-bottom:2.5px solid var(--obi-red);padding-bottom:1px}
.sc-card h3{font-size:15px;font-weight:900;color:var(--paper);margin-bottom:3px}
.sc-card h3 .en{font-family:'Archivo Black',sans-serif;font-size:10px;color:var(--gold);margin-left:6px}
.sc-card p{font-size:11.5px;color:var(--dim);line-height:1.7}
.diff-row{display:flex;gap:10px}
.diff{flex:1;padding:10px;border:1px solid #3a3532;border-radius:3px;background:transparent;
  color:var(--steel);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.diff{display:flex;flex-direction:column;align-items:center;gap:3px}
.diff b{font-size:15px;font-weight:900}
.diff span{font-size:10px;font-weight:500;color:var(--dim);line-height:1.4}
.diff[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:#2a2522}
.diff[aria-pressed="true"] span{color:var(--gold)}
.start-btn{
  font-family:'Archivo Black',sans-serif;font-size:18px;letter-spacing:.12em;
  background:var(--obi-red);color:#fff;border:none;border-radius:3px;
  padding:16px 42px;cursor:pointer;
}
.start-btn:active{transform:scale(.97)}
.ts-note{font-size:10px;color:var(--dim);line-height:1.8;text-align:center;margin-bottom:auto}
/* ========== チャット画面 ========== */
.chat-screen{flex:1;display:none;flex-direction:column;min-height:0}
.chat-head{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid #262220;background:#161210;
}
.avatar{width:38px;height:38px;flex-shrink:0}
.chat-head .who{flex:1;min-width:0}
.chat-head .name{font-weight:900;font-size:14px;color:var(--paper)}
.chat-head .status{font-size:10px;color:var(--dim)}
.gauge-wrap{width:110px}
.gauge-label{font-size:9px;color:var(--gold);font-weight:700;letter-spacing:.1em;text-align:right}
.gauge{height:6px;background:#262220;border-radius:3px;overflow:hidden;margin-top:2px}
.gauge-bar{height:100%;background:linear-gradient(90deg,var(--obi-red),var(--gold));width:50%;transition:width .4s}
.se-chip{font-size:10px;font-weight:700;padding:4px 8px;border:1px solid #3a3532;border-radius:2px;
  background:transparent;color:var(--steel);cursor:pointer;font-family:inherit}
.se-chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.msgs{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;max-width:88%}
.msg .avatar{width:30px;height:30px;margin-top:2px}
.msg .bubble{
  background:var(--bubble);border-radius:3px 12px 12px 12px;padding:10px 13px;
  font-size:14px;line-height:1.75;color:var(--paper);
}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bubble{background:var(--me);border-radius:12px 3px 12px 12px}
.msg.sys{align-self:center;max-width:94%}
.msg.sys .bubble{background:transparent;border:1px dashed #3a3532;color:var(--dim);font-size:11.5px;text-align:center}
.bubble .jp{display:block;font-size:11px;color:var(--dim);margin-top:6px;border-top:1px dashed #3a3532;padding-top:5px}
.vocab{
  color:var(--gold);font-weight:700;border-bottom:1px dashed var(--gold);
  cursor:pointer;
}
.typing{align-self:flex-start;color:var(--dim);font-size:12px;padding-left:40px}
.typing::after{content:'…';animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
/* 選択肢 */
.choices{padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px;border-top:1px solid #262220;background:#141110}
.choice{
  text-align:left;padding:12px 14px;border:1px solid #3a3532;border-radius:3px;
  background:#1C1714;color:var(--paper);font-family:inherit;font-size:13.5px;line-height:1.6;
  cursor:pointer;
}
.choice:active{background:#2a211b}
.choice:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* ========== ピック辞書ポップアップ ========== */
.pickpop{
  position:fixed;inset:0;z-index:40;display:none;
  background:rgba(10,8,7,.86);backdrop-filter:blur(2px);
  align-items:center;justify-content:center;flex-direction:column;padding:20px;
}
.pickpop.open{display:flex}
.pickpop svg{width:min(230px,58vw);filter:drop-shadow(0 12px 22px rgba(0,0,0,.6))}
.pickpop .sheet{
  background:var(--paper);color:var(--ink);width:min(330px,88vw);
  border-radius:3px;padding:14px 16px;margin-top:12px;
}
.pickpop .meaning{font-weight:900;font-size:18px;border-bottom:2px solid var(--obi-red);padding-bottom:7px;margin-bottom:8px}
.pickpop .note{font-size:12.5px;line-height:1.8;font-weight:500}
.pickpop .close-hint{color:var(--dim);font-size:11px;margin-top:12px}
/* ========== エンディング/復習 ========== */
.end-screen{flex:1;display:none;flex-direction:column;align-items:center;padding:24px 18px;gap:14px;overflow-y:auto}
.end-rank{font-family:'Archivo Black',sans-serif;font-size:clamp(24px,7vw,34px);text-align:center}
.end-rank.true{color:var(--gold)}
.end-rank.ok{color:var(--steel)}
.end-rank.poser{color:var(--obi-red)}
.end-msg{font-size:13px;line-height:1.9;text-align:center;max-width:340px}
.recap{width:min(380px,94vw)}
.recap h3{font-size:13px;font-weight:900;color:var(--paper);margin:10px 0 8px;letter-spacing:.1em}
.recap-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  border:1px solid #2c2724;border-radius:3px;margin-bottom:6px;background:#1A1512;
}
.recap-item .t{flex:1;font-size:13px;font-weight:700;color:var(--gold)}
.recap-item .jpn{font-size:11px;color:var(--dim)}
.rbtn{font-size:10px;font-weight:900;font-family:'Archivo Black',sans-serif;
  padding:7px 9px;border-radius:2px;border:1px solid #3a3532;background:transparent;color:var(--steel);cursor:pointer}
.rbtn.sel-know{border-color:var(--gold);color:var(--gold)}
.rbtn.sel-again{border-color:var(--obi-red);color:var(--obi-red)}
.end-actions{display:flex;gap:12px;margin-top:6px}
/* ================= 媒体別スキン ================= */
/* 共通: 紙もの上の文字色・語彙リンク(金→帯赤で可読性確保) */
[data-skin] .msg:not(.sys) .bubble{color:#1E1B18;box-shadow:0 3px 10px rgba(0,0,0,.35)}
[data-skin] .msg:not(.sys) .bubble .vocab{color:#A3121F;border-color:#A3121F;font-weight:900}
[data-skin] .msg:not(.sys) .bubble .jp{color:#6b6257;border-top-color:#c9c0b2}

/* ---- memo: 楽屋のマジック書きメモ(ガムテ貼り) ---- */
[data-skin="memo"] .msgs{background:
  repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 2px,transparent 2px 4px),#33302C}
[data-skin="memo"] .msg .bubble{
  background:#F7F5EF;border-radius:1px;position:relative;
  font-family:'Permanent Marker','Yomogi',sans-serif;font-size:15px;line-height:1.7;
  transform:rotate(-1.1deg)}
[data-skin="memo"] .msg:nth-child(even) .bubble{transform:rotate(.9deg)}
[data-skin="memo"] .msg .bubble::before{ /* ガムテープ */
  content:"";position:absolute;top:-8px;left:18px;width:52px;height:16px;
  background:rgba(165,160,150,.75);transform:rotate(-4deg);border-radius:1px}
[data-skin="memo"] .msg.me .bubble{background:#FFF3A1;transform:rotate(1.2deg)}
[data-skin="memo"] .choice{background:#F7F5EF;color:#1E1B18;border-color:#8a857c;
  font-family:'Permanent Marker','Yomogi',sans-serif}

/* ---- airmail: エアメール便箋 ---- */
[data-skin="airmail"] .msgs{background:#E8E1D2}
[data-skin="airmail"] .msg .bubble{
  background:#FBF7EC;border-radius:2px;position:relative;
  font-family:'Special Elite','Yomogi',monospace;font-size:14px;line-height:1.85;
  border:7px solid;padding:12px 14px;
  border-image:repeating-linear-gradient(-45deg,#C8313E 0 9px,#FBF7EC 9px 18px,#2B4C9B 18px 27px,#FBF7EC 27px 36px) 7}
[data-skin="airmail"] .msg:not(.me) .bubble::after{ /* 消印風 */
  content:"PAR AVION";position:absolute;top:-11px;right:10px;
  font-family:'Special Elite',monospace;font-size:9px;letter-spacing:.1em;color:#2B4C9B;
  border:1.5px solid #2B4C9B;border-radius:50%;padding:7px 5px;transform:rotate(9deg);
  background:rgba(251,247,236,.9)}
[data-skin="airmail"] .msg.me .bubble{
  background:#FFFFFF;border-image:none;border:1px solid #c9c0b2;
  background-image:repeating-linear-gradient(transparent 0 25px,#D9E4EE 25px 26px)}
[data-skin="airmail"] .choice{background:#FBF7EC;color:#1E1B18;border-color:#b5aa96;
  font-family:'Special Elite','Yomogi',monospace}

/* ---- pop: レコ屋の木目棚+手書きPOP ---- */
[data-skin="pop"] .msgs{background:
  linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.18)),
  repeating-linear-gradient(90deg,#7C4F2C 0 72px,#6A4123 72px 76px),#7C4F2C}
[data-skin="pop"] .msg .bubble{
  background:#FDFBF4;border-radius:2px;transform:rotate(-.6deg);
  font-family:'Yomogi','Permanent Marker',sans-serif;font-size:15px;line-height:1.75}
[data-skin="pop"] .msg.me .bubble{ /* 店側=黄色POPカード */
  background:#FFE95C;border:3px solid #C41E2A;transform:rotate(1deg);
  font-weight:700}
[data-skin="pop"] .choice{background:#FFE95C;color:#1E1B18;border-color:#C41E2A;
  font-family:'Yomogi',sans-serif;font-weight:700}

/* ---- notepad: 新聞切り抜き広告+電話メモ帳 ---- */
[data-skin="notepad"] .msgs{background:#47413D}
[data-skin="notepad"] .msg .bubble{
  background:#FFFFFF;border-radius:1px;position:relative;padding-left:30px;
  background-image:
    repeating-linear-gradient(transparent 0 24px,#C3D7E8 24px 25px),
    linear-gradient(90deg,transparent 0 22px,#E8A0A6 22px 23px,transparent 23px);
  font-family:'Yomogi',sans-serif;font-size:15px;line-height:1.7}
[data-skin="notepad"] .msg .bubble::before{ /* 綴じ穴 */
  content:"";position:absolute;left:4px;top:8px;bottom:8px;width:12px;
  background-image:radial-gradient(circle 4px at 6px 10px,#47413D 4px,transparent 5px);
  background-size:12px 26px;background-repeat:repeat-y}
[data-skin="notepad"] .msg .bubble.ad{ /* 冒頭の新聞広告 */
  background:#ECE7DB;background-image:none;padding:14px 16px;
  font-family:Georgia,'Zen Kaku Gothic New',serif;font-size:13.5px;line-height:1.7;
  border:3px double #3a3632;transform:rotate(-1.6deg);
  outline:1px dashed #8a8378;outline-offset:5px}
[data-skin="notepad"] .msg .bubble.ad::before{display:none}
[data-skin="notepad"] .choice{background:#fff;color:#1E1B18;border-color:#9a948c;
  font-family:'Yomogi',sans-serif;
  background-image:repeating-linear-gradient(transparent 0 24px,#C3D7E8 24px 25px)}

/* ---- zine: コピー誌切り抜き+罫線ノートの手紙 ---- */
[data-skin="zine"] .msgs{background:#D8D2C4}
[data-skin="zine"] .msg .bubble{
  background:#FFFFFF;border-radius:0;
  background-image:repeating-linear-gradient(transparent 0 25px,#CBD6DF 25px 26px);
  font-family:'Special Elite','Yomogi',monospace;font-size:14px;line-height:1.85}
[data-skin="zine"] .msg .bubble.ad{ /* ファンジン切り抜き */
  background:#FDFDFB;background-image:none;
  border:3.5px solid #111;transform:rotate(1.4deg);
  outline:1.5px dashed #555;outline-offset:5px;
  font-family:'Special Elite',monospace;filter:contrast(1.06)}
[data-skin="zine"] .msg.me .bubble{background:#FBF7EC;background-image:
  repeating-linear-gradient(transparent 0 25px,#E0D6BE 25px 26px)}
[data-skin="zine"] .choice{background:#fff;color:#1E1B18;border-color:#777;
  font-family:'Special Elite','Yomogi',monospace}

.type-cursor{display:inline-block;width:.52em;height:1em;background:currentColor;opacity:.75;
  vertical-align:-.12em;margin-left:1px;animation:tcur .75s steps(1) infinite}
@keyframes tcur{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){ .gauge-bar{transition:none} }
</style>
</head>

let AC=null, seOn=true;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function distCurve(k){const n=512,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i/n*2-1;c[i]=Math.tanh(x*k)}return c}
function ampChain(a,drive,level,decay){
  const pre=a.createGain();pre.gain.value=drive;
  const ws=a.createWaveShaper();ws.curve=distCurve(28);ws.oversample='2x';
  const cab=a.createBiquadFilter();cab.type='lowpass';cab.frequency.value=3600;
  const hp=a.createBiquadFilter();hp.type='highpass';hp.frequency.value=70;
  const post=a.createGain();const t=a.currentTime;
  post.gain.setValueAtTime(level,t);post.gain.exponentialRampToValueAtTime(.0001,t+decay);
  pre.connect(ws).connect(cab).connect(hp).connect(post).connect(a.destination);
  return pre;
}
function pluck(a,freq,t0,damp,fb,dur,out){
  const N=Math.max(8,Math.floor(a.sampleRate*.005));
  const nb=a.createBuffer(1,N,a.sampleRate),d=nb.getChannelData(0);
  for(let i=0;i<N;i++)d[i]=Math.random()*2-1;
  const src=a.createBufferSource();src.buffer=nb;
  const del=a.createDelay(.05);del.delayTime.value=1/freq;
  const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=damp;
  const g=a.createGain();g.gain.setValueAtTime(fb,t0);g.gain.exponentialRampToValueAtTime(.15,t0+dur);
  src.connect(del);del.connect(lp);lp.connect(g);g.connect(del);lp.connect(out);
  src.start(t0);src.stop(t0+.01);
  setTimeout(()=>{try{src.disconnect();del.disconnect();lp.disconnect();g.disconnect()}catch(e){}},(t0-a.currentTime+dur+.4)*1000);
}
function seChord(){if(!seOn)return;const a=ac(),t=a.currentTime+.01;const amp=ampChain(a,7,.26,1.3);
  [82.41,123.47,164.81,246.94].forEach((f,i)=>pluck(a,f,t+i*.022,5200,.988,1.2,amp))}
function seMute(){if(!seOn)return;const a=ac(),t=a.currentTime+.01;const amp=ampChain(a,12,.45,.4);
  pluck(a,82.41,t,750,.90,.16,amp);pluck(a,82.41,t+.11,700,.88,.14,amp)}
function seScratch(){if(!seOn)return;const a=ac(),t=a.currentTime;
  const len=.22,buf=a.createBuffer(1,a.sampleRate*len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=a.createBufferSource();src.buffer=buf;
  const bp=a.createBiquadFilter();bp.type='bandpass';bp.Q.value=3;
  bp.frequency.setValueAtTime(2400,t);bp.frequency.exponentialRampToValueAtTime(400,t+len);
  const g=a.createGain();g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+len);
  src.connect(bp).connect(g).connect(a.destination);src.start(t);src.stop(t+len)}

/* ---------- ゲーム状態 ---------- */
let scKey='roadie', diff='nurume', beatIdx=0, gauge=50, seen=new Map();
let scoreSum=0, scoreMax=0;   // ランク判定は到達率(獲得/満点)で行う
const $=id=>document.getElementById(id);

function buildTitle(){
  const wrap=$('scCards');wrap.innerHTML='';
  for(const [k,s] of Object.entries(SCENARIOS)){
    const b=document.createElement('button');
    b.className='sc-card';b.setAttribute('aria-pressed',String(k===scKey));
    b.innerHTML=`<div class="sc-en">${esc(s.en).replace(/(19\d{2})/,'<span class="yr">$1</span>')}</div><h3>${s.name}</h3><p>${s.desc}</p>`;
    b.onclick=()=>{scKey=k;document.querySelectorAll('.sc-card').forEach(c=>c.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')};
    wrap.appendChild(b);
  }
}
document.querySelectorAll('.diff').forEach(b=>b.onclick=()=>{
  diff=b.dataset.diff;
  document.querySelectorAll('.diff').forEach(c=>c.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');
});
$('seToggle').onclick=()=>{seOn=!seOn;$('seToggle').setAttribute('aria-pressed',String(seOn))};

function startGame(){
  ac();
  beatIdx=0;gauge=50;seen=new Map();
  $('titleScreen').style.display='none';$('endScreen').style.display='none';
  $('chatScreen').style.display='flex';
  const s=SCENARIOS[scKey];
  scoreSum=0;
  scoreMax=s.beats.reduce((a,b)=>a+Math.max(...b.choices.map(c=>c.q)),0);
  document.body.dataset.skin=s.skin||'';
  $('npcName').textContent=s.npc;
  $('headAvatar').innerHTML=avatarSVG(s.avatarChar,s.pillarColor);
  $('msgs').innerHTML='';
  addSys(`${s.en} — ${diff==='jigoku'?'難度:地獄':'難度:ぬるめ'}`);
  updateGauge();
  playBeat();
}
$('startBtn').onclick=startGame;
$('backTitle').onclick=()=>{document.body.dataset.skin='';$('endScreen').style.display='none';$('titleScreen').style.display='flex'};

function updateGauge(){$('gaugeBar').style.width=Math.max(0,Math.min(100,gauge))+'%'}
function scrollBottom(){
  /* 描画確定後に実行(選択肢描画でmsgsが縮んでも最新発言が見える) */
  requestAnimationFrame(()=>{const m=$('msgs');m.scrollTop=m.scrollHeight;});
}

function addSys(text){
  const d=document.createElement('div');d.className='msg sys';
  d.innerHTML=`<div class="bubble">${esc(text)}</div>`;
  $('msgs').appendChild(d);scrollBottom();
}
function highlight(text,vocab){
  /* «term» を金語彙spanへ */
  return esc(text).replace(/«(.+?)»/g,(_,w)=>`<span class="vocab" data-term="${esc(w)}">${esc(w)}</span>`);
}
function addNpc(lines,jp,vocab,isAd,done){
  const s=SCENARIOS[scKey];
  const d=document.createElement('div');d.className='msg';
  const body=lines.map(l=>highlight(l,vocab)).join('<br>');
  const gloss=(diff==='nurume'&&jp)?`<span class="jp">${esc(jp)}</span>`:'';
  d.innerHTML=`<div class="avatar">${avatarSVG(s.avatarChar,s.pillarColor)}</div><div class="bubble${isAd?' ad':''}">${body}${gloss}</div>`;
  $('msgs').appendChild(d);scrollBottom();
  typeInto(d.querySelector('.bubble'),done);
}
function addMe(text,done){
  const d=document.createElement('div');d.className='msg me';
  d.innerHTML=`<div class="bubble">${esc(text)}</div>`;
  $('msgs').appendChild(d);scrollBottom();
  typeInto(d.querySelector('.bubble'),done);
}
function addNpcReact(text,done){
  const s=SCENARIOS[scKey];
  const d=document.createElement('div');d.className='msg';
  d.innerHTML=`<div class="avatar">${avatarSVG(s.avatarChar,s.pillarColor)}</div><div class="bubble">${highlight(text)}</div>`;
  $('msgs').appendChild(d);scrollBottom();
  typeInto(d.querySelector('.bubble'),done);
}

/* ---------- タイプライター演出 ----------
   HTML構造(語彙span/改行)を保ったまま、テキストノード単位で1文字ずつ復元。
   全文訳(.jp)は打了後に表示。タップで即全文。reduced-motionは即時。 */
function typeInto(bubble,done){
  const finishOnce=()=>{ if(fin)return; fin=true;
    clearInterval(timer);clearTimeout(startT);
    nodes.forEach(n=>n.node.textContent=n.full);
    cursor.remove();
    if(jpEl) jpEl.style.display='';
    scrollBottom();
    bubble.removeEventListener('click',finishOnce);
    if(done)done();
  };
  let fin=false, timer=null, startT=null;
  const jpEl=bubble.querySelector('.jp');
  if(jpEl) jpEl.style.display='none';
  /* .jp以外のテキストノードを収集 */
  const nodes=[];
  const walk=(el)=>{
    for(const c of Array.from(el.childNodes)){
      if(c.nodeType===3){ const t=c.textContent; if(t.trim()!=='') nodes.push({node:c,full:t}); }
      else if(c.nodeType===1 && !c.classList.contains('jp')) walk(c);
    }
  };
  walk(bubble);
  const total=nodes.reduce((a,n)=>a+n.full.length,0);
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(total===0||reduce){ if(jpEl)jpEl.style.display=''; scrollBottom(); if(done)done(); return; }
  /* 封筒(枠)を完成サイズで先に見せる */
  bubble.style.minHeight=bubble.offsetHeight+'px';
  nodes.forEach(n=>n.node.textContent='');
  const cursor=document.createElement('span');cursor.className='type-cursor';
  nodes[0].node.parentNode.insertBefore(cursor,nodes[0].node.nextSibling);
  scrollBottom();
  const d=Math.max(9,Math.min(26,Math.floor(2400/total)));   // 長文ほど速く、最長約2.5秒
  let ni=0,ci=0,tick=0;
  bubble.addEventListener('click',finishOnce);
  startT=setTimeout(()=>{ timer=setInterval(()=>{
    const cur=nodes[ni];
    ci++;
    cur.node.textContent=cur.full.slice(0,ci);
    cur.node.parentNode.insertBefore(cursor,cur.node.nextSibling);
    if(++tick%6===0)scrollBottom();
    if(ci>=cur.full.length){ ni++; ci=0; if(ni>=nodes.length) finishOnce(); }
  },d); },420);
}

function playBeat(){
  const s=SCENARIOS[scKey];
  if(beatIdx>=s.beats.length){ endGame(); return; }
  const beat=s.beats[beatIdx];
  /* 遭遇語彙を記録 */
  for(const [t,hint] of Object.entries(beat.vocab||{})) if(!seen.has(normTerm(t))) seen.set(normTerm(t),{term:t,hint});
  $('choices').innerHTML='';
  const typing=document.createElement('div');typing.className='typing';typing.textContent='入力中';
  $('msgs').appendChild(typing);scrollBottom();
  setTimeout(()=>{
    typing.remove();
    const isAd=beatIdx===0&&(SCENARIOS[scKey].skin==='notepad'||SCENARIOS[scKey].skin==='zine');
    addNpc(beat.npc,beat.jp,beat.vocab,isAd,()=>renderChoices(beat));
  },650);
}
function renderChoices(beat){
  const box=$('choices');box.innerHTML='';
  /* 正解位置の固定を防ぐ: 表示順をシャッフル */
  const order=[...beat.choices];
  for(let i=order.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [order[i],order[j]]=[order[j],order[i]];
  }
  order.forEach(c=>{
    const b=document.createElement('button');b.className='choice';
    b.innerHTML=highlight(c.t);
    b.onclick=()=>{
      box.innerHTML='';
      addMe(c.t.replace(/«|»/g,''),()=>{
        setTimeout(()=>{
          addNpcReact(c.react,()=>{
            beatIdx++;
            setTimeout(playBeat,450);
          });
        },350);
      });
      let q=c.q;
      if(diff==='jigoku'&&q<0) q=Math.round(q*1.5);
      gauge+=q;scoreSum+=q;updateGauge();
      if(q>0) seChord(); else if(q<0) seMute();
      /* 反応内の«»語彙も記録 */
      (c.react.match(/«(.+?)»/g)||[]).forEach(m=>{const t=m.replace(/«|»/g,'');
        if(!seen.has(normTerm(t))) seen.set(normTerm(t),{term:t,hint:null});});
    };
    box.appendChild(b);
  });
  scrollBottom(); /* 選択肢が出てmsgs欄が縮んだ後に最下部へ再スクロール */
}

/* ---------- 語彙ポップアップ(ピック辞書) ---------- */
/* 表記ゆれ救済: 完全一致→部分一致(長い方優先・4文字未満キーは除外) */
function resolveTerm(t){
  const k=normTerm(t);
  if(masterIndex.has(k)) return masterIndex.get(k);
  let best=null;
  for(const [mk,e] of masterIndex){
    if(mk.length<4&&k.length<4) continue;
    if(mk.includes(k)||k.includes(mk)){
      if(!best||mk.length>best.mk.length) best={mk,e};
    }
  }
  return best?best.e:null;
}
document.addEventListener('click',(ev)=>{
  const v=ev.target.closest('.vocab');
  if(!v) return;
  const term=v.dataset.term;
  const key=normTerm(term);
  const m=resolveTerm(term);
  const pillar=m?m.pillar:1;
  const fromSeen=seen.get(key);
  $('popSvg').innerHTML=miniPickSVG(m?m.term:term,pillar);
  $('popMeaning').textContent=m?m.meaning_jp:(fromSeen&&fromSeen.hint?fromSeen.hint:'(辞書準備中)');
  $('popNote').textContent=m?(m.metal_note||''):'';
  $('pickpop').classList.add('open');
  seScratch();
});
$('pickpop').onclick=()=>$('pickpop').classList.remove('open');

/* ---------- エンディング+復習仕分け ---------- */
const store={
  get(){try{return JSON.parse(localStorage.getItem('metal-eigo')||'{}')}catch(e){return{}}},
  set(v){try{localStorage.setItem('metal-eigo',JSON.stringify(v))}catch(e){}},
};
function endGame(){
  $('chatScreen').style.display='none';
  const e=$('endScreen');e.style.display='flex';
  const rank=$('endRank'), msg=$('endMsg');
  /* 到達率で判定(満点はシナリオごとに自動計算) */
  const ratio=scoreMax>0?scoreSum/scoreMax:0;
  const pct=Math.round(Math.max(0,ratio)*100);
  if(ratio>=0.8){rank.textContent='TRUE METALHEAD';rank.className='end-rank true';
    msg.textContent=`正解率 ${pct}%／METAL魂 ${gauge} — 「You're one of us!」楽屋に招待された。お前はもう鋼鉄の兄弟だ。`;}
  else if(ratio>=0.35){rank.textContent='ROADIE認定';rank.className='end-rank ok';
    msg.textContent=`正解率 ${pct}%／METAL魂 ${gauge} — 「Not bad, kid.」まあ許す。次のツアーも呼んでやる。`;}
  else{rank.textContent='POSER認定';rank.className='end-rank poser';
    msg.textContent=`正解率 ${pct}%／METAL魂 ${gauge} — 「Wimps and posers, leave the hall!」出禁。鋼鉄の道は遠い。`;}
  /* 仕分けリスト構築 */
  const list=$('recapList');list.innerHTML='';
  recapItems=[];sessionSort=new Map();
  for(const {term,hint} of seen.values()){
    const m=masterIndex.get(normTerm(term));
    const id=m?m.id:('TSUME:'+normTerm(term));
    const item={id,term:m?m.term:term,meaning:m?m.meaning_jp:(hint||''),
      note:m?(m.metal_note||''):'',pillar:m?m.pillar:1,row:null};
    const row=document.createElement('div');row.className='recap-item';item.row=row;
    row.innerHTML=`<span class="t">${esc(item.term)}</span>
      <span class="jpn">${esc(item.meaning)}</span>
      <button class="rbtn" data-v="know">MASTERED</button>
      <button class="rbtn" data-v="again">ONE MORE</button>`;
    row.querySelectorAll('.rbtn').forEach(btn=>btn.onclick=()=>sortItem(item,btn.dataset.v,true));
    list.appendChild(row);recapItems.push(item);
  }
  updateReviewBtn();
}

/* ---------- A案: ONE MORE即復習 ---------- */
let recapItems=[], sessionSort=new Map(), revList=[], revIdx=0;
function sortItem(item,v,withSe){
  const prog=store.get();prog[item.id]=v;store.set(prog);   // localStorageに永続
  sessionSort.set(item.id,v);
  item.row.querySelectorAll('.rbtn').forEach(x=>{
    x.className='rbtn'+(x.dataset.v===v?(' '+(v==='know'?'sel-know':'sel-again')):'');
  });
  if(withSe){ if(v==='know')seChord(); else seMute(); }
  updateReviewBtn();
}
function updateReviewBtn(){
  const n=[...sessionSort.values()].filter(v=>v==='again').length;
  const btn=$('startReview');
  btn.style.display=n?'':'none';
  btn.textContent='ONE MOREを復習 ▶ '+n+'枚';
}
function renderRev(){
  const it=revList[revIdx];
  $('revCount').textContent='REVIEW '+(revIdx+1)+' / '+revList.length;
  $('revSvg').innerHTML=miniPickSVG(it.term,it.pillar);
  $('revMeaning').textContent=it.meaning;
  $('revNote').textContent=it.note;
  $('revSheet').style.display='none';                        // 毎枚、意味は伏せて出題
}
function revFlip(){
  const s=$('revSheet');
  s.style.display = s.style.display==='none' ? '' : 'none';
  seScratch();
}
function revJudge(v){
  sortItem(revList[revIdx],v,false);
  if(v==='know')seChord(); else seMute();
  revIdx++;
  if(revIdx>=revList.length){ $('review').classList.remove('open'); }
  else renderRev();
}
$('startReview').onclick=()=>{
  revList=recapItems.filter(it=>sessionSort.get(it.id)==='again');
  if(!revList.length)return;
  revIdx=0;$('review').classList.add('open');renderRev();
};
$('revSvg').onclick=revFlip;
$('revFlip').onclick=revFlip;
$('revKnow').onclick=()=>revJudge('know');
$('revAgain').onclick=()=>revJudge('again');
$('revExit').onclick=()=>$('review').classList.remove('open');

/* ---------- 起動: master.json読込(辞書用) ---------- */
async function loadMaster(){
  let data=EMBED;
  if(!data){try{const r=await fetch('./metal-eigo-master.json');if(r.ok)data=await r.json()}catch(e){}}
  if(data&&data.entries) for(const e of data.entries) masterIndex.set(normTerm(e.term),e);
}
loadMaster().then(buildTitle);
